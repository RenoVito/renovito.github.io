
<html lang="it"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amenimia — Vito Renò</title>
  <meta name="description" content="Amenimia. È ciò che accade quando l'io smette di osservare il mondo e ricomincia ad appartenergli.">
  <meta name="author" content="Vito Renò">
  <meta name="theme-color" content="#111111">

  <style>
    :root {
      --paper: #111111;
      --ink: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      font-family: "Canela", "Cormorant Garamond", Garamond, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 6vw, 96px);
    }

    .intro {
      width: min(1200px, 100%);
      text-align: center;
      transform: translateY(-3vh);
    }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 14vw, 12rem);
      font-weight: 300;
      line-height: 0.9;
      letter-spacing: -0.055em;
    }

    .statement {
      margin: clamp(52px, 7vh, 84px) auto 0;
      max-width: 28ch;
      font-size: clamp(1.8rem, 3.25vw, 3.7rem);
      font-weight: 300;
      line-height: 1.14;
      letter-spacing: -0.025em;
    }

    .statement span {
      display: block;
    }

    @media (max-width: 720px) {
      main {
        padding: 24px 18px;
      }

      .intro {
        transform: translateY(-2vh);
      }

      h1 {
        font-size: clamp(4.5rem, 21vw, 7.5rem);
        line-height: 0.92;
      }

      .statement {
        margin-top: 54px;
        max-width: 22ch;
        font-size: clamp(1.6rem, 7vw, 2.5rem);
        line-height: 1.16;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="intro" aria-labelledby="amenimia-title">
      <h1 id="amenimia-title">Amenimia</h1>

      <p class="statement">
        <span>È ciò che accade quando</span>
        <span>l'io smette di osservare il mondo</span>
        <span>e ricomincia ad appartenergli.</span>
      </p>
    </section>
  </main>


</body></html>
